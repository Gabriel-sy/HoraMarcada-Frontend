<div class="absolute inset-0 bg-black/40 backdrop-blur-[2px] transition-opacity duration-300 ease-in-out opacity-0"
     [class.opacity-0]="!isOpen()"
     [class.opacity-100]="isOpen()"
     (click)="onClose()"></div>

<div class="fixed bg-white shadow-2xl transition-transform duration-300 ease-in-out z-50 flex flex-col
            bottom-0 left-0 right-0 h-[60vh] rounded-t-2xl w-full
            md:top-0 md:bottom-0 md:right-0 md:left-auto md:h-full md:w-md md:rounded-l-2xl md:rounded-tr-none
            translate-y-full md:translate-y-0 md:translate-x-full"
     [class.translate-y-full]="!isOpen()"
     [class.md:translate-x-full]="!isOpen()"
     [class.translate-y-0]="isOpen()"
     [class.md:translate-x-0]="isOpen()">
   
   <div class="flex justify-between items-center p-6 border-b border-border-light shrink-0">
     <h3 class="m-0 text-lg font-bold text-text-primary">
       Filtrar por Profissional
     </h3>
     <button 
       type="button" 
       class="bg-transparent border-none text-2xl cursor-pointer text-text-secondary hover:text-text-primary leading-none transition-colors" 
       (click)="onClose()">
       ×
     </button>
   </div>

   <div class="flex-1 overflow-y-auto p-6 flex flex-col gap-4">
     <app-selection-card
       [selected]="selectedProfessionalId() === null"
       (select)="onSelect(null)">
       <div card-content class="flex items-center gap-3">
         <div class="w-10 h-10 rounded-full bg-accent-light flex items-center justify-center text-text-primary">
           <svg class="w-5 h-5 text-text-secondary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
             <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
           </svg>
         </div>
         <div>
           <h3 class="font-semibold text-text-primary text-base">Todos</h3>
           <p class="text-xs text-text-secondary mt-0.5">Exibe a agenda integrada de todos os profissionais</p>
         </div>
       </div>
     </app-selection-card>

     @for (professional of professionals(); track professional.id) {
       <app-selection-card 
         [selected]="selectedProfessionalId() === professional.id" 
         (select)="onSelect(professional.id)">
         <div card-content class="flex items-center gap-3">
           @if (professional.photoUrl) {
             <img [src]="professional.photoUrl" class="w-10 h-10 rounded-full object-cover" [alt]="professional.name" />
           } @else {
             <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-text-secondary font-semibold text-sm">
               {{ professional.name.charAt(0).toUpperCase() }}
             </div>
           }
           <div>
             <h3 class="font-semibold text-text-primary text-base">{{ professional.name }}</h3>
           </div>
         </div>
       </app-selection-card>
     }
   </div>
</div>
