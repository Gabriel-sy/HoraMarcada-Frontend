  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">

<a routerLink="servicos" routerLinkActive="text-accent! bg-transparent!" class="flex-1 flex flex-col items-center justify-center gap-1 text-text-secondary text-[11px] font-medium transition-all duration-200">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-3.75 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />

<a routerLink="profissionais" routerLinkActive="text-accent! bg-transparent!" class="flex-1 flex flex-col items-center justify-center gap-1 text-text-secondary text-[11px] font-medium transition-all duration-200">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
  </svg>
  <span>Profissionais</span>
</a>

<button type="button" class="flex-1 flex flex-col items-center justify-center gap-1 text-text-secondary text-[11px] font-medium transition-all duration-200 border-none bg-transparent cursor-pointer active:scale-95" [class.text-accent]="isOpen()" (click)="toggleMenu()">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 transition-transform duration-200" [class.rotate-90]="isOpen()">
    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
  </svg>
  <span>Mais</span>
</button>

<div class="fixed inset-0 bg-transparent z-40"
     [class.pointer-events-none]="!isOpen()"
     [class.pointer-events-auto]="isOpen()"
     (click)="closeMenu()"></div>

<div class="fixed bottom-20 right-4 w-56 bg-white rounded-xl shadow-xl border border-border-light p-2 flex flex-col gap-1 transition-all duration-200 ease-out z-50 origin-bottom-right"
     [class.opacity-0]="!isOpen()"
     [class.translate-y-4]="!isOpen()"
     [class.scale-95]="!isOpen()"
     [class.pointer-events-none]="!isOpen()"
     [class.opacity-100]="isOpen()"
     [class.translate-y-0]="isOpen()"
     [class.scale-100]="isOpen()"
     [class.pointer-events-auto]="isOpen()">
  <a routerLink="clientes" routerLinkActive="bg-accent-light! text-text-primary! font-semibold" class="flex items-center gap-3 px-4 py-3 rounded-lg text-text-secondary text-sm font-medium hover:bg-accent-light hover:text-text-primary transition-all duration-200" (click)="closeMenu()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.109A11.386 11.386 0 0 1 10.089 20c-2.3 0-4.47-.682-6.3-1.858v-.1a4.125 4.125 0 0 1 7.533-2.493M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM19.5 7.875a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z" />
    </svg>
    <span>Clientes</span>
  </a>

  <a routerLink="estatisticas" routerLinkActive="bg-accent-light! text-text-primary! font-semibold" class="flex items-center gap-3 px-4 py-3 rounded-lg text-text-secondary text-sm font-medium hover:bg-accent-light hover:text-text-primary transition-all duration-200" (click)="closeMenu()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v5.75c0 .621-.504 1.125-1.125 1.125h-2.25A1.125 1.125 0 0 1 3 18.875v-5.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v10.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125v-10.25ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v14.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
    </svg>
    <span>Estatísticas</span>
  </a>

  <div class="h-px bg-border-light my-1 mx-2"></div>

  <button type="button" class="flex items-center gap-3 w-full px-4 py-3 rounded-lg bg-transparent text-text-secondary text-sm font-medium hover:bg-red-50 hover:text-red-600 cursor-pointer transition-all duration-200 active:scale-[0.98] border-none" (click)="onLogout()">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
    </svg>
    <span>Sair</span>
  </button>
</div>
