<div class="p-6 border-b border-border-light">
  @if (store(); as s) {
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full overflow-hidden bg-accent-light flex items-center justify-center border border-border-light shrink-0">
        @if (s.logoUrl) {
          <img [src]="s.logoUrl" [alt]="s.name" class="w-full h-full object-cover" />
        } @else {
          <span class="font-semibold text-text-primary text-base">{{ s.name.charAt(0).toUpperCase() }}</span>
        }
      </div>
      <div class="flex flex-col min-w-0">
        <span class="text-sm font-semibold text-text-primary truncate">{{ s.name }}</span>
        <span class="text-xs text-text-secondary">Painel Admin</span>
      </div>
    </div>
  } @else {
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full overflow-hidden bg-accent-light flex items-center justify-center border border-border-light shrink-0">
        <span class="font-semibold text-text-primary text-base">HM</span>
      </div>
      <div class="flex flex-col min-w-0">
        <span class="text-sm font-semibold text-text-primary truncate">HoraMarcada</span>
        <span class="text-xs text-text-secondary">Conectando...</span>
      </div>
    </div>
  }
</div>

<nav class="p-4 flex flex-col gap-1 flex-1">
  <a routerLink="agenda" routerLinkActive="bg-accent-light! text-text-primary! font-semibold" class="flex items-center gap-3 px-4 py-3 rounded-lg text-text-secondary text-sm font-medium hover:bg-accent-light hover:text-text-primary transition-all duration-200">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
    </svg>
    <span>Agenda</span>
  </a>

  <a routerLink="servicos" routerLinkActive="bg-accent-light! text-text-primary! font-semibold" class="flex items-center gap-3 px-4 py-3 rounded-lg text-text-secondary text-sm font-medium hover:bg-accent-light hover:text-text-primary transition-all duration-200">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-3.75 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
    </svg>
    <span>Serviços</span>
  </a>

  <a routerLink="profissionais" routerLinkActive="bg-accent-light! text-text-primary! font-semibold" class="flex items-center gap-3 px-4 py-3 rounded-lg text-text-secondary text-sm font-medium hover:bg-accent-light hover:text-text-primary transition-all duration-200">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 shrink-0">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
    </svg>
    <span>Profissionais</span>
  </a>
</nav>

    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.43l-1.003.828c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.43l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
    </svg>
    <span>Desenvolvedor</span>
  </button>
</div>
