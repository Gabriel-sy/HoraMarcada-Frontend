<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 backdrop-blur-[4px]">
  <div class="w-full max-w-md bg-white rounded-xl shadow-2xl p-6 mx-4 box-border">
    <div class="flex justify-between items-center mb-5">
      <h3 class="m-0 text-lg font-semibold">Configuração de Simulação</h3>
      <button type="button" class="bg-transparent border-none text-2xl cursor-pointer text-text-secondary leading-none" (click)="onClose()">×</button>
    </div>
    <div class="flex flex-col gap-4 mb-6">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-text-secondary">ID do Usuário (UUID)</label>
        <input type="text" [(ngModel)]="localUserId" class="px-3 py-2.5 border border-border-light rounded-lg text-sm w-full focus:outline-none focus:border-accent box-border" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-semibold text-text-secondary">Token JWT (Opcional - para APIs Autenticadas)</label>
        <textarea [(ngModel)]="localToken" class="px-3 py-2.5 border border-border-light rounded-lg text-sm w-full min-h-[80px] resize-y focus:outline-none focus:border-accent box-border" placeholder="Cole o token JWT do Supabase..."></textarea>
      </div>
    </div>
    <div class="flex justify-end gap-3">
      <button type="button" class="px-4 py-2.5 bg-transparent border border-border-light rounded-lg text-sm font-medium text-text-secondary cursor-pointer" (click)="onClose()">Cancelar</button>
      <button type="button" class="px-4 py-2.5 bg-accent text-text-primary border-none rounded-lg text-sm font-semibold cursor-pointer hover:bg-accent-hover" (click)="onSave()">Salvar e Recarregar</button>
    </div>
  </div>
</div>
