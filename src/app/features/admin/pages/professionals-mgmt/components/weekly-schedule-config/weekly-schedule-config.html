@for (day of weeklyHours(); track $index; let i = $index) {
  <div class="border border-border-light rounded-xl p-4 flex flex-col gap-3.5 bg-white">
    <div class="flex items-center justify-between">
      <span class="text-sm font-bold text-text-primary capitalize">{{ DAYS_OF_WEEK[i] }}</span>
      <div class="flex items-center gap-2">
        <input 
          type="checkbox" 
          [id]="'day-active-' + i" 
          [checked]="day.active" 
          (change)="updateDayActive(i, !day.active)" 
          class="w-4 h-4 rounded border-border-light text-text-primary focus:ring-text-primary cursor-pointer" />
        <label [for]="'day-active-' + i" class="text-xs font-bold text-text-secondary cursor-pointer select-none">
          Atende neste dia
        </label>
      </div>
    </div>

    @if (day.active) {
      <div class="flex flex-col gap-4 mt-1">
        <div class="grid grid-cols-2 gap-3">
          <div class="flex flex-col gap-1.5">
            <label class="text-[10px] font-bold text-text-secondary uppercase tracking-wider">Horário de Início</label>
            <input 
              type="time" 
              [(ngModel)]="day.startTime" 
              (ngModelChange)="onHoursChange()"
              class="px-3 py-2 border border-border-light rounded-lg text-xs w-full focus:outline-none focus:border-text-primary transition-colors" />
          </div>

          <div class="flex flex-col gap-1.5">
            <label class="text-[10px] font-bold text-text-secondary uppercase tracking-wider">Horário de Fim</label>
            <input 
              type="time" 
              [(ngModel)]="day.endTime" 
              (ngModelChange)="onHoursChange()"
              class="px-3 py-2 border border-border-light rounded-lg text-xs w-full focus:outline-none focus:border-text-primary transition-colors" />
          </div>
        </div>

        <div class="flex flex-col gap-1.5">
          <div class="flex items-center gap-1">
            <label class="text-[10px] font-bold text-text-secondary uppercase tracking-wider">Intervalo de Agendamento</label>
            <div class="group relative inline-block">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5 text-text-secondary cursor-help">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z" />
              </svg>
              <div class="invisible group-hover:visible opacity-0 group-hover:opacity-100 transition-all duration-200 absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-48 p-2 bg-text-primary text-white text-[10px] rounded-lg shadow-md z-50 text-center font-normal pointer-events-none normal-case">
                Determina o espaçamento das vagas exibidas para o cliente (Ex: a cada 30 min).
                <div class="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-text-primary"></div>
              </div>
            </div>
          </div>
          <app-select 
            [id]="'day-interval-' + i"
            label="Intervalo de Agendamento"
            [options]="intervalOptions"
            bindLabel="label"
            bindValue="value"
            [(ngModel)]="day.intervalMinutes" 
            (ngModelChange)="onHoursChange()" />
        </div>

        <div class="flex items-center gap-2 py-1.5 pt-4 border-t border-dashed border-border-light">
          <input 
            type="checkbox" 
            [id]="'day-lunch-' + i" 
            [checked]="day.hasLunch" 
            (change)="updateDayLunchActive(i, !day.hasLunch)" 
            class="w-3.5 h-3.5 rounded border-border-light text-text-primary focus:ring-text-primary cursor-pointer" />
          <label [for]="'day-lunch-' + i" class="text-xs font-semibold text-text-primary cursor-pointer select-none">
            Possui horário de almoço
          </label>
        </div>

        @if (day.hasLunch) {
          <div class="grid grid-cols-2 gap-3">
            <div class="flex flex-col gap-1.5">
              <label class="text-[10px] font-bold text-text-secondary uppercase tracking-wider">Início Almoço</label>
              <input 
                type="time" 
                [(ngModel)]="day.lunchStart" 
                (ngModelChange)="onHoursChange()"
                class="px-3 py-2 border border-border-light rounded-lg text-xs w-full focus:outline-none focus:border-text-primary transition-colors" />
            </div>

            <div class="flex flex-col gap-1.5">
              <label class="text-[10px] font-bold text-text-secondary uppercase tracking-wider">Fim Almoço</label>
              <input 
                type="time" 
                [(ngModel)]="day.lunchEnd" 
                (ngModelChange)="onHoursChange()"
                class="px-3 py-2 border border-border-light rounded-lg text-xs w-full focus:outline-none focus:border-text-primary transition-colors" />
            </div>
          </div>
        }
      </div>
    }
  </div>
}
