<div class="absolute inset-0 bg-black/40 backdrop-blur-[2px] transition-opacity duration-300 ease-in-out opacity-0"
     [class.opacity-0]="!isOpen()"
     [class.opacity-100]="isOpen()"
     (click)="onClose()"></div>

<div class="fixed bg-white shadow-2xl transition-transform duration-300 ease-in-out z-50 flex flex-col
            bottom-0 left-0 right-0 h-[85vh] rounded-t-2xl w-full
            md:top-0 md:bottom-0 md:right-0 md:left-auto md:h-full md:w-md md:rounded-l-2xl md:rounded-tr-none
            translate-y-full md:translate-y-0 md:translate-x-full"
     [class.translate-y-full]="!isOpen()"
     [class.md:translate-x-full]="!isOpen()"
     [class.translate-y-0]="isOpen()"
     [class.md:translate-x-0]="isOpen()">
   
   <div class="flex justify-between items-center p-6 border-b border-border-light shrink-0">
     <h3 class="m-0 text-lg font-bold text-text-primary">
       {{ service() ? 'Editar Serviço' : 'Novo Serviço' }}
     </h3>
     <button 
       type="button" 
       class="bg-transparent border-none text-2xl cursor-pointer text-text-secondary hover:text-text-primary leading-none transition-colors" 
       (click)="onClose()">
       ×
     </button>
   </div>

   <div class="flex-1 overflow-y-auto p-6 flex flex-col gap-5">
     <div class="flex flex-col gap-1.5">
       <label class="text-xs font-semibold text-text-secondary">Nome do Serviço</label>
       <input 
         type="text" 
         [(ngModel)]="formName" 
         class="px-3.5 py-2.5 border border-border-light rounded-xl text-sm w-full focus:outline-none focus:border-text-primary transition-colors box-border" 
         placeholder="Ex: Corte Degradê, Escova Progressiva..." />
     </div>

     <div class="grid grid-cols-2 gap-4">
       <div class="flex flex-col gap-1.5">
         <label class="text-xs font-semibold text-text-secondary">Preço (R$)</label>
         <input 
           type="number" 
           [(ngModel)]="formPrice" 
           class="px-3.5 py-2.5 border border-border-light rounded-xl text-sm w-full focus:outline-none focus:border-text-primary transition-colors box-border" 
           placeholder="Ex: 50" />
       </div>

       <div class="flex flex-col gap-1.5">
         <label class="text-xs font-semibold text-text-secondary">Duração (minutos)</label>
         <input 
           type="number" 
           [(ngModel)]="formDuration" 
           class="px-3.5 py-2.5 border border-border-light rounded-xl text-sm w-full focus:outline-none focus:border-text-primary transition-colors box-border" 
           placeholder="Ex: 45" />
       </div>
     </div>

     <div class="flex flex-col gap-2">
       <label class="text-xs font-semibold text-text-secondary">Profissionais Habilitados</label>
       <p class="text-[11px] text-text-secondary m-0 mt-1">Selecione quais profissionais podem realizar este serviço para seus clientes.</p>
       <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-1">
         @for (prof of professionals(); track prof.id) {
           <button 
             type="button" 
             class="flex items-center justify-between p-3 border rounded-xl text-left cursor-pointer transition-all duration-200"
             [ngClass]="isProfessionalSelected(prof.id) ? 'border-text-primary bg-neutral-50 font-bold' : 'border-border-light bg-white hover:border-text-muted'"
             (click)="toggleProfessional(prof.id)">
             <div class="flex items-center gap-2.5 min-w-0">
               <div class="w-7 h-7 rounded-full bg-neutral-100 border border-neutral-200/50 flex items-center justify-center font-bold text-xs shrink-0 text-text-primary">
                 {{ prof.name.charAt(0).toUpperCase() }}
               </div>
               <span class="text-xs text-text-primary truncate">{{ prof.name }}</span>
             </div>
             @if (isProfessionalSelected(prof.id)) {
               <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-4 h-4 text-text-primary shrink-0">
                 <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
               </svg>
             }
           </button>
         }
       </div>
     </div>

     <div class="flex items-center justify-between p-4 rounded-xl border border-border-light">
       <div class="flex flex-col gap-0.5">
         <span class="text-sm font-semibold text-text-primary">Status do Serviço</span>
         <span class="text-xs text-text-secondary">Defina se este serviço está disponível para agendamento</span>
       </div>
       <button 
         type="button"
         class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none"
         [ngClass]="formActive() ? 'bg-text-primary' : 'bg-neutral-200'"
         (click)="formActive.set(!formActive())">
         <span 
           class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow-sm ring-0 transition duration-200 ease-in-out"
           [ngClass]="formActive() ? 'translate-x-5' : 'translate-x-0'">
         </span>
       </button>
     </div>
   </div>

   <div class="flex justify-between items-center p-6 border-t border-border-light bg-neutral-50 shrink-0">
     <div>
       @if (service()) {
         <button 
           type="button" 
           class="px-4 py-2.5 bg-transparent border border-red-200 text-red-600 rounded-xl text-sm font-semibold hover:bg-red-50 hover:border-red-300 transition-all cursor-pointer active:scale-95 flex items-center gap-1.5"
           (click)="onDelete()">
           <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-4 h-4">
             <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
           </svg>
           Excluir
         </button>
       }
     </div>
     <div class="flex items-center gap-3">
       <button 
         type="button" 
         class="px-4 py-2.5 bg-transparent border border-border-light rounded-xl text-sm font-semibold text-text-secondary cursor-pointer hover:bg-white transition-all active:scale-95" 
         (click)="onClose()">
         Cancelar
       </button>
       <button 
         type="button" 
         class="px-5 py-2.5 bg-text-primary text-white border-none rounded-xl text-sm font-semibold cursor-pointer hover:bg-neutral-800 transition-all active:scale-[0.97] flex items-center gap-2"
         [disabled]="submitting()"
         (click)="submitForm()">
         @if (submitting()) {
           <div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
         }
         Salvar
       </button>
     </div>
   </div>

</div>
