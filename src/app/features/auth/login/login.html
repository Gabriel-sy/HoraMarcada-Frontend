<div class="min-h-screen bg-white text-text-primary font-sans flex flex-col justify-center px-6 py-12 md:py-24 box-border animate-scale-up">
  <div class="w-full max-w-sm mx-auto flex flex-col gap-8">
    <div class="flex flex-col items-center text-center gap-3">
      <div class="w-12 h-12 rounded-2xl bg-text-primary text-white flex items-center justify-center font-bold text-lg select-none">
        <img class="w-full h-full" src="logo.png" alt="Logo">
      </div>
      <div class="flex flex-col gap-1 mt-2">
        <h1 class="text-xl font-bold tracking-tight m-0">Entrar no HoraMarcada</h1>
        <p class="text-xs text-text-secondary m-0">Painel do Empreendedor</p>
      </div>
    </div>

    <form (submit)="onSubmit(); $event.preventDefault()" class="flex flex-col gap-5">
      <div class="relative w-full">
        <input 
          type="email" 
          id="email" 
          placeholder=" " 
          [(ngModel)]="email" 
          name="email" 
          required
          class="peer px-4 pt-6 pb-2 border border-border-light rounded-xl text-sm w-full focus:outline-none focus:border-text-primary transition-all box-border bg-transparent" />
        <label 
          for="email" 
          class="absolute left-4 top-4.5 text-sm text-text-secondary transition-all duration-200 pointer-events-none origin-left
                 peer-focus:top-1.5 peer-focus:text-xs peer-focus:text-text-primary
                 peer-[:not(:placeholder-shown)]:top-1.5 peer-[:not(:placeholder-shown)]:text-xs">
          E-mail
        </label>
      </div>

      <div class="relative w-full">
        <input 
          type="password" 
          id="password" 
          placeholder=" " 
          [(ngModel)]="password" 
          name="password" 
          required
          class="peer px-4 pt-6 pb-2 border border-border-light rounded-xl text-sm w-full focus:outline-none focus:border-text-primary transition-all box-border bg-transparent" />
        <label 
          for="password" 
          class="absolute left-4 top-4.5 text-sm text-text-secondary transition-all duration-200 pointer-events-none origin-left
                 peer-focus:top-1.5 peer-focus:text-xs peer-focus:text-text-primary
                 peer-[:not(:placeholder-shown)]:top-1.5 peer-[:not(:placeholder-shown)]:text-xs">
          Senha
        </label>
      </div>

      @if (errorMessage()) {
        <p class="text-xs font-semibold text-[#dc2626] m-0 self-start">
          {{ errorMessage() }}
        </p>
      }

      <button 
        type="submit" 
        [disabled]="loading()"
        class="w-full py-3.5 bg-text-primary text-white border-none rounded-xl text-sm font-semibold cursor-pointer hover:bg-neutral-800 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-2 disabled:opacity-75 disabled:cursor-not-allowed">
        @if (loading()) {
          <div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
        }
        <span>Entrar</span>
      </button>
    </form>
  </div>
</div>
