<div class="relative w-full">
  <button
    type="button"
    [id]="id()"
    [disabled]="disabled()"
    (click)="toggleDropdown($event)"
    class="w-full h-[48px] border rounded-md text-text-primary text-left outline-none focus:outline-none active:outline-none focus-visible:outline-none transition-all cursor-pointer disabled:opacity-50 disabled:bg-gray-100 bg-white relative"
    [class.border-accent]="isOpen()"
    [class.ring-2]="isOpen()"
    [class.ring-accent/20]="isOpen()"
    [class.border-border-light]="!isOpen()"
    [class.hover:border-text-muted]="!isOpen() && !disabled()">
    <span
      class="absolute left-[13px] bottom-[6.5px] block truncate text-sm font-normal pr-8 pointer-events-none"
      [class.text-text-primary]="selectedOptionLabel()"
      [class.text-text-secondary]="!selectedOptionLabel()">
      {{ selectedOptionLabel() || placeholder() }}
    </span>
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" 
         class="absolute right-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-text-secondary transition-all duration-200 shrink-0 pointer-events-none"
         [class.rotate-180]="isOpen()">
      <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
    </svg>
  </button>
  <label
    [for]="id()"
    class="absolute left-[13px] top-1.5 text-xs transition-all duration-200 pointer-events-none origin-left"
    [class.text-text-primary]="isOpen()"
    [class.text-text-secondary]="!isOpen()">
    {{ label() }}
  </label>
  
  <div 
    class="absolute left-0 right-0 mt-0.5 bg-white border border-border-light rounded-md shadow-lg z-50 overflow-y-auto origin-top py-1 opacity-0 scale-y-0 pointer-events-none"
    [style.max-height]="dropdownMaxHeight()"
    [class.transition-all]="dropdownAnimated()"
    [class.duration-200]="dropdownAnimated()"
    [class.opacity-100]="isOpen()"
    [class.scale-y-100]="isOpen()"
    [class.opacity-0]="!isOpen()"
    [class.scale-y-0]="!isOpen()"
    [class.pointer-events-none]="!isOpen()"
    >
    @for (option of options(); track getOptionValue(option); let idx = $index) {
      <button
        type="button"
        (click)="selectOption(option)"
        class="w-full text-left px-3 py-2.5 text-sm text-text-primary hover:bg-accent-light transition-colors flex items-center justify-between cursor-pointer"
        [class.bg-accent-light]="isOptionSelected(option)"
        [class.bg-accent-light/40]="idx === focusedOptionIndex() && !isOptionSelected(option)">
        <span class="block truncate">{{ getOptionLabel(option) }}</span>
        @if (isOptionSelected(option)) {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5 text-text-primary shrink-0 ml-2">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
        }
      </button>
    }
  </div>
</div>
