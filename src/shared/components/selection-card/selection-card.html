<div
  (click)="onSelect()"
  [class]="'flex justify-between items-center border rounded-lg cursor-pointer transition-all duration-200 ' +
           (compact() ? 'p-3 gap-2' : 'p-5') + ' ' +
           (selected() ? 'border-text-primary bg-accent-light' : 'border-border-light hover:border-text-primary')">
  <div class="flex-1">
    <ng-content select="[card-content]"></ng-content>
  </div>
  <div
    [class]="'rounded-full border flex items-center justify-center transition-all duration-200 shrink-0 ' +
             (compact() ? 'w-4 h-4' : 'w-5 h-5') + ' ' +
             (selected() ? 'border-text-primary' : 'border-border-light')">
    @if (selected()) {
      <div [class]="'rounded-full bg-accent animate-scale-up ' + (compact() ? 'w-3 h-3' : 'w-4.5 h-4.5')"></div>
    }
  </div>
</div>
