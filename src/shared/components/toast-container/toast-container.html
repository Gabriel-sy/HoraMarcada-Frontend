<div class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 max-w-[calc(100vw-2rem)] sm:max-w-md w-full pointer-events-none px-4 sm:px-0">
  @for (toast of toasts(); track toast.id) {
    <div 
      [class]="getToastClass(toast.type)"
      [class.animate-slide-in-right]="!toast.isLeaving"
      [class.animate-slide-out-right]="toast.isLeaving"
      class="flex items-center justify-between gap-3 p-4 rounded-md border text-sm pointer-events-auto transition-all duration-300"
    >
      <span class="flex-1 font-medium">{{ toast.message }}</span>
      <button 
        (click)="remove(toast.id)"
        class="text-text-muted hover:text-text-primary p-0.5 cursor-pointer active:scale-90 flex items-center justify-center"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
